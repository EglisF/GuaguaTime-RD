<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulador de rutas y costos del transporte público dominicano">
    <meta name="theme-color" content="#3b82f6">
    <title>GuaguaTime RD - Simulador de Rutas y Costos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="header-content">
                <h1>
                    <span aria-hidden="true">🚌</span>
                    GuaguaTime RD
                </h1>
                <div class="controls">
                    <button class="btn-icon" id="themeToggle" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
                    <button class="btn-icon" id="langToggle" aria-label="Cambiar entre español e inglés">🌐</button>
                </div>
            </div>
        </header>

        <main>
            <aside>
                <section class="card">
                    <h2 data-i18n="planRoute">Planifica tu ruta</h2>
                    
                    <form id="routeForm">
                        <div class="form-group">
                            <label for="origin" data-i18n="origin">Origen</label>
                            <select id="origin" required>
                                <option value="" data-i18n="chooseNeighborhood">Selecciona un barrio</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="destination" data-i18n="destination">Destino</label>
                            <select id="destination" required>
                                <option value="" data-i18n="chooseNeighborhood">Selecciona un barrio</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary" data-i18n="calculate">Calcular rutas</button>
                    </form>

                    <div id="alerts"></div>
                </section>

                <section class="card" id="favoritesSection" style="display: none;">
                    <h2 data-i18n="favorites">⭐ Mis Favoritas</h2>
                    <div id="favoritesList" class="favorites-list"></div>
                </section>
            </aside>

            <section>
                <div class="card">
                    <div class="sort-control">
                        <button class="sort-btn active" data-sort="time" data-i18n="sortTime">Por tiempo</button>
                        <button class="sort-btn" data-sort="cost" data-i18n="sortCost">Por costo</button>
                        <button class="sort-btn" data-sort="transfers" data-i18n="sortTransfers">Por transbordos</button>
                    </div>
                    <div id="results"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 GuaguaTime RD - <span data-i18n="footer">Simulador de transporte público dominicano</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
